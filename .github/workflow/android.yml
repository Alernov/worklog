name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Установить зависимости
        run: npm install

      - name: Собрать веб-часть
        run: node scripts/build-web.mjs

      - name: Создать проект Android
        run: npx cap add android

      - name: Иконка и номер версии
        run: |
          node scripts/apply-icons.mjs
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Ключ подписи (один и тот же для всех сборок, чтобы обновлять приложение поверх)
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      - name: Синхронизировать и собрать APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Подготовить файл
        run: cp android/app/build/outputs/apk/debug/app-debug.apk worklog.apk

      - uses: actions/upload-artifact@v4
        with:
          name: worklog-apk
          path: worklog.apk

      - name: Выложить APK в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Рабочий график (APK)
          body: Последняя сборка приложения. Скачайте worklog.apk и установите на телефон.
          files: worklog.apk
