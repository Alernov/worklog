<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Рабочий график</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="view"></main>
  <nav id="tabs">
    <button data-tab="calendar" class="active">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      Календарь
    </button>
    <button data-tab="summary">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="3"/><circle cx="12" cy="12" r="2.5"/></svg>
      Итоги
    </button>
    <button data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      Настройки
    </button>
  </nav>
  <div id="sheetRoot"></div>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
  <script src="app.js"></script>
</body>
</html>
